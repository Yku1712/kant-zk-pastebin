# Kant Pastebin Beta Site — /pastebin/beta/
# Generated by deploy-beta.sh
# Do not edit manually — regenerate via the deploy script

location /pastebin/beta/ {
    proxy_pass http://127.0.0.1:8084/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Beta site headers - show version info
    add_header X-Pastebin-Beta-Version "v0.2.0";
    add_header X-Pastebin-Beta-Commit "c28a133672ce40644fd2855d2f9b018ca151d748";
    add_header X-Pastebin-Beta-Port "8084";
    
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    charset utf-8;
}
