pid /run/nginx/nginx.pid;
error_log stderr;
daemon off;
events {
}
http {
	# /enricher/ task-enricher GUI: strip the prefix off the STILL-ENCODED
	# $request_uri (regex map). Trailing-slash proxy_pass decodes %2F and
	# every /api/task/<encoded dir> click 404s — measured 2026-10-25.
	map $request_uri $enricher_uri {
		~^/enricher(?<enricher_rest>/.*)$ $enricher_rest;
		default                          $uri;
	}
	# Load mime types and configure maximum size of the types hash tables.
	include /nix/store/b73wvf83q4cjwzz99pdanbl8qpfawr69-mailcap-2.1.54/etc/nginx/mime.types;
	types_hash_max_size 2688;
	include /nix/store/agas6mvy1q4rmqr7974dg84ab8r03b5f-nginx-1.30.0/conf/fastcgi.conf;
	include /nix/store/agas6mvy1q4rmqr7974dg84ab8r03b5f-nginx-1.30.0/conf/uwsgi_params;
	default_type application/octet-stream;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
	proxy_redirect          off;
	proxy_connect_timeout   60s;
	proxy_send_timeout      60s;
	proxy_read_timeout      60s;
	proxy_http_version      1.1;
	# don't let clients close the keep-alive connection to upstream. See the nginx blog for details:
	# https://www.nginx.com/blog/avoiding-top-10-nginx-configuration-mistakes/#no-keepalives
	proxy_set_header        "Connection" "";
	include /nix/store/0mpnp9g93isr1qrsisxx3g60xlin9w4a-nginx-recommended-proxy_set_header-headers.conf;
	# $connection_upgrade is used for websocket proxying
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}
	client_max_body_size 10m;
	server_tokens off;
	# Private server — no upload limits on any endpoint
	client_body_buffer_size 1024k;
	# Fix "could not build optimal proxy_headers_hash" warning —
	# many proxy_set_header directives need a larger hash table
	proxy_headers_hash_max_size 1024;
	proxy_headers_hash_bucket_size 128;
	# Map non-2xx status codes to flag for error document logging
	map $status $is_error {
		~^[23]  0;
		default 1;
	}
# WebSocket upgrade for proxied services (kant-zk relay /ws/{room})
	# (triple-quote is how a literal two-quote escapes inside a Nix indented string)
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}
	# Research-grade access logging (all requests)
log_format research '"$time_iso8601" client=$remote_addr method=$request_method uri=$request_uri status=$status body_bytes=$body_bytes_sent referer=$http_referer user_agent=$http_user_agent request_time=${request_time}s upstream_addr=$upstream_addr upstream_status=$upstream_status scheme=$scheme host=$host';
	access_log /var/log/nginx/research.access.log research;
	error_log /var/log/nginx/research.error.log warn;
	# Structured error document archive (all 4xx/5xx responses)
	log_format error_doc '
	=== Error Document ===
	Date: $time_iso8601
	Client: $remote_addr
	Method: $request_method
	URI: $request_uri
	Status: $status
	Bytes: $body_bytes_sent
	Content-Type: $sent_http_content_type
	Referer: $http_referer
	User-Agent: $http_user_agent
	Request-Time: $request_time
	Upstream-Addr: $upstream_addr
	Upstream-Status: $upstream_status
	Host: $host
	X-Forwarded-For: $http_x_forwarded_for
	Server-Name: $server_name
	Request-Body: $request_body
	-------------------
	';
	access_log /var/log/nginx/error-docs/error.log error_doc if=$is_error;
	server {
		listen 0.0.0.0:80 ;
		listen [::0]:80 ;
		server_name solana.solfunmeme.com ;
		location / {
			return 301 https://$host$request_uri;
		}
	}
	server {
		listen 0.0.0.0:443 ssl ;
		listen [::0]:443 ssl ;
		server_name solana.solfunmeme.com ;
# http2 on;
		ssl_certificate /etc/letsencrypt/live/solana.solfunmeme.com/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/solana.solfunmeme.com/privkey.pem;
		# Serve the central app index (issue #197 / generate-app-index.sh): the
		# 443 vhost had no root, so / fell through to nginx default root and
		# served the stock welcome page instead of /var/www/.../index.html.
		# The legacy vhost (nginx/sites-available/solana.solfunmeme.com) has had
		# root /var/www/solana.solfunmeme.com; since before the hand-merge.
		root /var/www/solana.solfunmeme.com;
		index index.html;
		# Modular Nginx location configurations
		include /etc/nginx-sm-merged/pastebin-lean.conf;
		include /etc/nginx-sm-merged/infra-tiles.conf;
		include /etc/nginx-sm-merged/harness-tiles.conf;
		include /etc/nginx-sm-merged/sparql-gui.conf;
		include /etc/nginx-sm-merged/apps.conf;
		include /etc/nginx-sm-merged/vault.conf;
		include /etc/nginx-sm-merged/static.conf;
		include /etc/nginx-sm-merged/tracker-worker.conf;
	include /etc/nginx-sm-merged/shmem-tools.conf;
	include /etc/nginx-sm-merged/sparql-api.conf;
		include /etc/nginx-sm-merged/twitter-storm.conf;
		include /etc/nginx-sm-merged/tracker-fleet.conf;
		include /etc/nginx-sm-merged/task-browser.conf;
		include /etc/nginx-sm-merged/enricher.conf;
		include /etc/nginx-sm-merged/thunk-surface.conf;
		# Status & test report (static, written by twitterstorm-status-report.service)
		include /etc/nginx-sm-merged/twitterstorm-report.conf;
		# /twitterstorm/ panel (systemd tracker-panel.service)
		include /etc/nginx-sm-merged/services.d/tracker-panel.conf;
		# Layered image (systemd tracker-overlay@full.service, in-image nginx :8098)
		include /etc/nginx-sm-merged/services.d/tracker-image-proxy.conf;

		# AgentsView session analytics (systemd agentsview.service :8087, repo:
		# nginx/services.d/agentsview.conf — was routed to dead :8082 before)
		include /etc/nginx-sm-merged/services.d/agentsview.conf;
		# CPA Usage Keeper dashboard (:8086) — unit deliberately disabled until
		# CPA_BASE_URL/CPA_MANAGEMENT_KEY exist, so this route 502s for now
		include /etc/nginx-sm-merged/services.d/cpa-usage-keeper.conf;

# Control Node GUI (Port 9999)
		include /etc/nginx-sm-merged/services.d/control-node.conf;
		# Go-live control deck (systemd golive-deck.service :3341)
		include /etc/nginx-sm-merged/services.d/golive-deck.conf;
        include /etc/nginx-sm-merged/services.d/golive-branch-base.conf;
		# Branch preview (deploy-plan.md): this branch's deck run DIRECTLY from
		# the golive-deck worktree on :3342 (no systemd) — hand-merged face
		include /etc/nginx-sm-merged/services.d/golive-branch-buffy-golive-deck-20261008.conf;
		# Branch preview (docs/GOLIVE_DECK.md): buffy/golive-status-20261009 deck
		# run DIRECTLY from its worktree on :3343 — hand-merged face
		include /etc/nginx-sm-merged/services.d/golive-branch-buffy-golive-status-20261009.conf;
		# Branch preview: buffy/golive-rule-20261009 deck on :3344
		include /etc/nginx-sm-merged/services.d/golive-branch-buffy-golive-rule-20261009.conf;
		# Branch preview: buffy/full-merge-20261012 (PR #506) deck on :3344
		include /etc/nginx-sm-merged/services.d/golive-branch-buffy-full-merge-20261012.conf;
		include /etc/nginx-sm-merged/services.d/golive-branch-feature-freebuff1.conf;
		# Branch preview: buffy/golive-gate-button-20261009 deck on :3346
		include /etc/nginx-sm-merged/services.d/golive-branch-buffy-golive-gate-button-20261009.conf;
		# Branch preview: buffy/golive-agents-log-20261010 deck on :3348
		include /etc/nginx-sm-merged/services.d/golive-branch-buffy-golive-agents-log-20261010.conf;
		# Branch preview: buffy/account-health-fail-closed-20261009 deck on :3345
		include /etc/nginx-sm-merged/services.d/golive-branch-buffy-account-health-fail-closed-20261009.conf;
		# Branch preview: qoder/golive-per-agent-20261009 deck on :3347 (docs/GOLIVE_WORKFLOW.md)
		include /etc/nginx-sm-merged/services.d/golive-branch-qoder-golive-per-agent-20261009.conf;
		include /etc/nginx-sm-merged/services.d/golive-branch-agent-golive-integration-20261012.conf;
        include /etc/nginx-sm-merged/services.d/golive-branch-dedup-dedup-refactor-uncommitted-20261013.conf;
		include /etc/nginx-sm-merged/services.d/golive-branch-qoder-golive-command-integration-20261015.conf;
		# Branch preview: buffy/integrate-all-20261015 deck on :3356 (2026-10-15)
		include /etc/nginx-sm-merged/services.d/golive-branch-buffy-integrate-all-20261015.conf;
		# Branch preview: buffy/golive-ladder-20261016 deck on :3358 (2026-10-16)
		include /etc/nginx-sm-merged/services.d/golive-branch-buffy-golive-ladder-20261016.conf;
		include /etc/nginx-sm-merged/services.d/golive-branch-buffy-golive-goals-update-20261016.conf;
        # Branch preview: agent/merge-sweep-20261016 deck on :3342 (2026-10-16)
        include /etc/nginx-sm-merged/services.d/golive-branch-agent-merge-sweep-20261016.conf;
		# Branch preview: buffy/golive-continue-20261017 deck on :3380 (2026-10-17)
		include /etc/nginx-sm-merged/services.d/golive-branch-buffy-golive-continue-20261017.conf;
		include /etc/nginx-sm-merged/services.d/golive-branch-agent-buffy-golive-continue-20261017.conf;
    include /etc/nginx-sm-merged/services.d/golive-branch-buffy-planv2-coordination-docs-wt.conf;
		# Branch preview (docs/GOLIVE_DECK.md): task-issues-mirror-20261020 deck on :3342
		include /etc/nginx-sm-merged/services.d/golive-branch-task-issues-mirror-20261020.conf;
		# Branch preview: fixme/user-merge deck on :3370 (2026-10-22)
		include /etc/nginx-sm-merged/services.d/golive-branch-fixme-user-merge.conf;
	include /etc/nginx-sm-merged/services.d/golive-branch-integration-all-open-20261018.conf;
		include /etc/nginx-sm-merged/services.d/golive-launch-dialog.conf;
		include /etc/nginx-sm-merged/services.d/golive-worker-dev.conf;
		include /etc/nginx-sm-merged/services.d/tracker-go-live.conf;
		include /etc/nginx-sm-merged/services.d/go-live-verified-website.conf;
		include /etc/nginx-sm-merged/services.d/planner-board.conf;
		# Zone 42 lattice (ports 42000–42002 + door 8157)
		include /etc/nginx-sm-merged/zone42.conf;
		# Agentaps web workspace
		include /etc/nginx-sm-merged/agentaps.conf;
	include /etc/nginx-sm-merged/jev-api.conf;
		# Kant Pastebin Beta Site (/pastebin-beta/) - Port 8093
		location /pastebin-beta/ {
			proxy_pass http://127.0.0.1:8093/;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			add_header X-Pastebin-Version "v0.2.0" always;
			add_header X-Pastebin-Git-Commit "c28a133672ce40644fd2855d2f9b018ca151d748" always;
			add_header X-Pastebin-Build-Time "2026-10-17T23:30:13Z" always;
			client_max_body_size 0;
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
			proxy_connect_timeout 3600s;
			proxy_buffering off;
			proxy_request_buffering off;
			charset utf-8;
		}

	}
}
